<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo Report Builder</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
    background:#f1f5f9;
    color:#334155;
    padding-bottom:100px;
}

.container{
    max-width:460px;
    margin:auto;
    padding:14px;
}

.card{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
    border:1px solid #e2e8f0;
    box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

.title{
    font-size:14px;
    font-weight:bold;
    color:#2563eb;
    margin-bottom:14px;
}

.form-group{
    margin-bottom:14px;
}

label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #cbd5e1;
    font-size:14px;
    background:white;
}

input[type=file]{
    border-style:dashed;
}

.preview{
    aspect-ratio:1584 / 1123;
    background:white;
    border:1px solid #cbd5e1;
    border-radius:10px;
    padding:12px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.preview-floor{
    font-size:7px;
    font-weight:900;
    border-bottom:1px solid #e2e8f0;
    padding-bottom:3px;
}

.preview-room{
    font-size:6px;
    margin-top:3px;
}

.preview-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px;
    height:65%;
}

.slot{
    border:1px solid #cbd5e1;
    background:#f8fafc;
    border-radius:5px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

.slot img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.placeholder{
    font-size:7px;
    color:#94a3b8;
}

.footer{
    text-align:center;
}

.remark{
    font-size:6px;
    font-weight:bold;
}

.auto-label{
    font-size:4px;
    margin-top:2px;
    font-family:monospace;
}

.bottom-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:white;
    border-top:1px solid #e2e8f0;
    padding:12px;
}

.btn{
    width:100%;
    border:none;
    background:#16a34a;
    color:white;
    padding:14px;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;
}

.loading{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    z-index:999;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:white;
}

.spinner{
    width:40px;
    height:40px;
    border:4px solid white;
    border-top-color:transparent;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin-bottom:10px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* HIDDEN EXPORT */

#exportArea{
    position:absolute;
    left:-99999px;
    top:-99999px;
    width:1584px;
    height:1123px;
    background:white;
    padding:60px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.export-title{
    font-size:24px;
    font-weight:900;
    border-bottom:3px solid black;
    padding-bottom:4px;
}

.export-room{
    font-size:18px;
    margin-top:8px;
    margin-bottom:20px;
}

.export-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
    height:720px;
}

.export-slot{
    border:1px solid #cbd5e1;
    background:#f8fafc;
    border-radius:6px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

.export-slot img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.export-footer{
    text-align:center;
}

.export-remark{
    font-size:20px;
    font-weight:bold;
}

.export-label{
    margin-top:8px;
    font-size:14px;
    font-family:monospace;
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="title">
            📋 Report Information
        </div>

        <div class="form-group">

            <label>Floor</label>

            <select id="floor" onchange="syncText()">

                <option>Ground Floor</option>
                <option>First Floor</option>
                <option>Second Floor</option>
                <option>Third Floor</option>

            </select>

        </div>

        <div class="form-group">

            <label>Room Name</label>

            <input
            type="text"
            id="room"
            placeholder="R Room"
            oninput="syncText()">

        </div>

        <div class="form-group">

            <label>Choose Photos</label>

            <input
            type="file"
            id="photos"
            multiple
            accept="image/*"
            onchange="loadImages()">

        </div>

        <div class="form-group">

            <label>Remark</label>

            <input
            type="text"
            id="remark"
            placeholder="Remark..."
            oninput="syncText()">

        </div>

    </div>

    <!-- LIVE PREVIEW -->

    <div class="card">

        <div class="title">
            🖼️ LIVE PREVIEW
        </div>

        <div class="preview">

            <div>

                <div class="preview-floor" id="pFloor">
                    Ground Floor
                </div>

                <div class="preview-room" id="pRoom">
                    R Room
                </div>

            </div>

            <div class="preview-grid">

                <div class="slot" id="slot0">
                    <span class="placeholder">Photo 1</span>
                </div>

                <div class="slot" id="slot1">
                    <span class="placeholder">Photo 2</span>
                </div>

                <div class="slot" id="slot2">
                    <span class="placeholder">Photo 3</span>
                </div>

                <div class="slot" id="slot3">
                    <span class="placeholder">Photo 4</span>
                </div>

            </div>

            <div class="footer">

                <div class="remark" id="pRemark">
                    -
                </div>

                <div class="auto-label" id="pLabel">
                    GF-R ROOM
                </div>

            </div>

        </div>

    </div>

</div>

<!-- BUTTON -->

<div class="bottom-bar">

    <button class="btn" onclick="downloadImage()">
        💾 JPEG Export
    </button>

</div>

<!-- LOADING -->

<div class="loading" id="loading">

    <div class="spinner"></div>

    <div>Exporting...</div>

</div>

<!-- HIDDEN EXPORT -->

<div id="exportArea">

    <div>

        <div class="export-title" id="eFloor">
            Ground Floor
        </div>

        <div class="export-room" id="eRoom">
            R Room
        </div>

        <div class="export-grid">

            <div class="export-slot" id="eSlot0"></div>
            <div class="export-slot" id="eSlot1"></div>
            <div class="export-slot" id="eSlot2"></div>
            <div class="export-slot" id="eSlot3"></div>

        </div>

    </div>

    <div class="export-footer">

        <div class="export-remark" id="eRemark">
        </div>

        <div class="export-label" id="eLabel">
        </div>

    </div>

</div>

<script>

function getCode(floor){

    if(floor.includes("Ground")) return "GF";
    if(floor.includes("First")) return "1F";
    if(floor.includes("Second")) return "2F";
    if(floor.includes("Third")) return "3F";

    return "SITE";
}

/* TEXT SYNC */

function syncText(){

    const floor =
    document.getElementById("floor").value;

    const room =
    document.getElementById("room").value || "R Room";

    const remark =
    document.getElementById("remark").value || "-";

    const code = getCode(floor);

    // PREVIEW

    document.getElementById("pFloor").innerText = floor;
    document.getElementById("pRoom").innerText = room;
    document.getElementById("pRemark").innerText = remark;
    document.getElementById("pLabel").innerText = `${code}-${room}`;

    // EXPORT

    document.getElementById("eFloor").innerText = floor;
    document.getElementById("eRoom").innerText = room;
    document.getElementById("eRemark").innerText = remark;
    document.getElementById("eLabel").innerText = `${code}-${room}`;
}

/* LOAD IMAGES */

function loadImages(){

    const files =
    Array.from(document.getElementById("photos").files).slice(0,4);

    // RESET

    for(let i=0;i<4;i++){

        document.getElementById(`slot${i}`).innerHTML =
        `<span class="placeholder">Photo ${i+1}</span>`;

        document.getElementById(`eSlot${i}`).innerHTML = "";
    }

    files.forEach((file,index)=>{

        const reader = new FileReader();

        reader.onload = function(e){

            const imgData = e.target.result;

            // PREVIEW IMAGE

            const img1 = document.createElement("img");

            img1.src = imgData;

            img1.onload = function(){

                document.getElementById(`slot${index}`).innerHTML = "";

                document.getElementById(`slot${index}`).appendChild(img1);

                // EXPORT IMAGE

                const img2 = document.createElement("img");

                img2.src = imgData;

                document.getElementById(`eSlot${index}`).appendChild(img2);
            };
        };

        reader.readAsDataURL(file);

    });

}

/* EXPORT */

async function downloadImage(){

    const room =
    document.getElementById("room").value.trim();

    if(!room){

        alert("Room Name ထည့်ပါ");

        return;
    }

    document.getElementById("loading").style.display = "flex";

    await new Promise(r=>setTimeout(r,1000));

    const area =
    document.getElementById("exportArea");

    html2canvas(area,{
        scale:2,
        useCORS:true,
        backgroundColor:"#ffffff"
    })
    .then(canvas=>{

        const url =
        canvas.toDataURL("image/jpeg",0.95);

        const link =
        document.createElement("a");

        link.download =
        `Report_${room}.jpg`;

        link.href = url;

        link.click();

        document.getElementById("loading").style.display = "none";
    })
    .catch(err=>{

        console.log(err);

        alert("Export Error");

        document.getElementById("loading").style.display = "none";
    });

}

/* INIT */

syncText();

</script>

</body>
</html>
